cargo-features = ["profile-rustflags"]

[package]
name = "os"
version = "0.1.0"
edition = "2024"

[dependencies]
static_assertions = "1.1.0"
num_enum = { version = "0.7.6", default-features = false }
seq-macro = "0.3.6"
buddy_system_allocator = "0.10.0"
bitvec = { version = "1.0.1", default-features = false }
hashbrown = "0.17.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
pin-weak = "1.1.0"
bitflags = "2.11.1"
xarray = "0.1.1"
intrusive-collections = "0.10.0"
log = "0.4.29"
derive_more = { version = "2.1.1", default-features = false, features = ["debug"] }
addr2line = { version = "0.26.1", default-features = false }
object = { version = "0.36", default-features = false, features = ["read_core", "elf"] }
flat_device_tree  = { version = "3.1.1", features = ["pretty-printing"] }
virtio-drivers = "0.13.0"
ext4_rs = { path = "../edited_lib/ext4_rs" }
uninit = { version = "0.6.2", default-features = false }
elf = { path = "../edited_lib/rust-elf", default-features = false }
bit_field = "0.10.3"

[features]
framepointer = []
default = ["framepointer"]

[target.riscv64gc-unknown-none-elf.dependencies]
riscv = "0.16.0"
