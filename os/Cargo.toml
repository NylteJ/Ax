cargo-features = ["profile-rustflags"]

[package]
name = "os"
version = "0.1.0"
edition = "2024"

[dependencies]
static_assertions = "1.1.0"
num_enum = { version = "0.7.6", default-features = false }
seq-macro = "0.3.6"
buddy_system_allocator = "0.13.0"
bitvec = { version = "1.0.1", default-features = false }
hashbrown = "0.17.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
bitflags = "2.11.1"
xarray = "0.1.1"
intrusive-collections = "0.10.0"
log = "0.4.29"
derive_more = { version = "2.1.1", default-features = false, features = ["debug"] }
object = { version = "0.36", default-features = false, features = ["read_core", "elf"] }
flat_device_tree  = { version = "3.1.1", features = ["pretty-printing"] }
virtio-drivers = "0.12.0"
ext4_rs = { path = "../edited_lib/ext4_rs" }
uninit = { version = "0.6.2", default-features = false }
elf = { path = "../edited_lib/rust-elf", default-features = false }
bit_field = "0.10.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
ringbuf = { version = "0.4.8", default-features = false, features = ["alloc"] }
rand = { version = "0.10.1", default-features = false, features = ["alloc", "chacha"] }
zerocopy = "0.8.48"
crossbeam = { version = "0.8.4", default-features = false, features = ["alloc"] }

# 这两个依赖用于 Debug 构建
addr2line = { version = "0.25.1", default-features = false }
allocator-api2 = { version = "0.2.21", default-features = false }

# smoltcp，用于网络模块，features 太多所以分开写
[dependencies.smoltcp]
path = "../edited_lib/smoltcp"
default-features = false
features = [
    "alloc",
    "proto-ipv4", "proto-ipv6",
    "medium-ethernet", "medium-ip",
    "socket-raw", "socket-icmp", "socket-udp", "socket-tcp", "socket-dns",
]

[features]
framepointer = []
has-debug-info = []
default = ["framepointer"]

[target.riscv64gc-unknown-none-elf.dependencies]
riscv = "0.16.0"

[profile.release]
lto = "fat"
codegen-units = 1
